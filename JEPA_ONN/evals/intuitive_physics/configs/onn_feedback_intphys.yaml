# V-JEPA IntPhys ONN feedback Predictor configuration.
predictor_type: onn_feedback

pretrain:
  enc_checkpoint_key: encoder
  pred_checkpoint_key: predictor
  model_name: vit_large
  patch_size: 16
  folder: /data/linux/wkx/IntPhys/references_code/references/checkpoints/vjepa
  checkpoint: vitl16.pth.tar
  write_tag: vjepa_vitl16_onn_feedback
  use_sdpa: true
  use_silu: false
  wide_silu: false
  uniform_power: true
  is_causal: false
  pred_is_causal: false
  pred_depth: 12
  tubelet_size: 2
  frames_per_clip: 16

data:
  batch_size: 20
  resolution: 224
  stride_sliding_window: 2
  use_bfloat16: true
  frames_per_clip: 16
  context_lengths: [2, 4, 6, 8, 10]
  frame_steps: 2

data_split:
  source: train
  manifest: /data/linux/wkx/IntPhys/references_code/references/splits/intphys_train_val.json
  num_train_videos: 800
  num_val_videos: 100
  split_seed: 42

training:
  mode: end_to_end_jepa
  experiment_mode: onn_feedback
  epochs: 50
  split_manifest: /data/linux/wkx/IntPhys/references_code/references/splits/intphys_train_val.json
  last_output: null
  clip_grad: 10.0

predictor:
  context_dim: 1024
  predictor_dim: 384
  output_dim: 1024
  num_tokens: 1568
  num_chunks: 8
  chunk_tokens: 196
  output_mlp_hidden_dim: 384

onn:
  input_dim: 384
  output_dim: 384
  num_slm_layers: 4
  feedback_mode: fixed_middle
  feedback_layer_index: 2
  readout_mode: intensity_minus_learnable_offset
  learnable_intensity_offset: true
  use_differential_detector: false
  pixel_pitch_um: 8.0
  wavelength_nm: 532.0
  slm_intervals_um: [25000.0, 25000.0, 25000.0]
  input_to_first_slm_um: 50000.0
  last_slm_to_detector_um: 50000.0
  asm_padding_factor: 2.0
  input_encoding_mode: signed_phase

tag: vjepa_vitl16_onn_feedback
nodes: 1
tasks_per_node: 1
eval_name: intuitive_physics
dataset: intphys

loss:
  loss_exp: 1.0
  reg_coeff: 0.0

evaluation:
  run_after_training: true
